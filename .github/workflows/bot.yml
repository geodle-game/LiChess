name: Lichess Bot

on:
  workflow_dispatch:
  schedule:
    # Fallback: fires every 6 hours in case the chain breaks.
    - cron: '0 */6 * * *'

concurrency:
  group: lichess-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # hard cap under GitHub's 360-minute limit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run bot for 5h30m
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: |
          timeout 19800 node bot.js || echo "bot exited ($?)"

      - name: Dispatch scheduler.yml to restart the chain
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/scheduler.yml/dispatches \
            -d '{"ref":"main"}'
